[build-system]
requires = ["flit_core>=3.12.0,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ansys-result-explorer-knowledge"
version = "0.1.dev0"
description = "Knowledge artifacts for ansys-result-explorer-core"
readme = "README.md"
requires-python = ">=3.10,<4.0"
authors = [
    { name = "ANSYS, Inc." },
]
maintainers = [
    { name = "ANSYS, Inc." },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "ansys-result-explorer-core==0.1.dev0",
]

[project.scripts]
pyrx-knowledge-generate = "ansys.result_explorer.knowledge.cli:main"

[tool.flit.module]
name = "ansys.result_explorer.knowledge"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "PLC",
    "PLE",
    "PLW",
    "D",
]

[tool.pydocstyle]
convention = "numpy"
