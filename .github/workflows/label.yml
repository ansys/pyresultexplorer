name: Labeler
on:
  pull_request:
    # opened, reopened, and synchronize are default for pull_request
    # edited - when PR title or body is changed
    # labeled - when labels are added to PR
    types: [opened, reopened, synchronize, edited, labeled]
  push:
    branches: [ main ]
    paths:
      - '../labels.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:

  label-syncer:
    name: "Syncer"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # Required to manage repository labels
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: micnncim/action-label-syncer@3abd5ab72fda571e69fffd97bd4e0033dd5f495c # v1.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  labeler:
    name: "Set labels"
    needs: [label-syncer]
    permissions:
      contents: read
      pull-requests: write # Required to add labels to pull requests
    runs-on: ubuntu-latest
    steps:

    # Label based on modified files or branch name
    - name: "Label based on changed files"
      uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        sync-labels: true

  commenter:
    name: "Commenter"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Required to comment on pull requests
    steps:
    - name: "Suggest to add labels"
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      # Execute only when no labels have been applied to the pull request
      if: toJSON(github.event.pull_request.labels.*.name) == '{}'
      with:
        issue-number: ${{ github.event.pull_request.number }}
        body: |
          Please add one of the following labels to add this contribution to the Release Notes :point_down:
          - [bug](https://github.com/ansys-internal/pyresultexplorer/pulls?q=label%3Abug+)
          - [documentation](https://github.com/ansys-internal/pyresultexplorer/pulls?q=label%3Adocumentation+)
          - [enhancement](https://github.com/ansys-internal/pyresultexplorer/pulls?q=label%3Aenhancement+)
          - [good first issue](https://github.com/ansys-internal/pyresultexplorer/pulls?q=label%3Agood+first+issue)
          - [maintenance](https://github.com/ansys-internal/pyresultexplorer/pulls?q=label%3Amaintenance+)
          - [release](https://github.com/ansys-internal/pyresultexplorer/pulls?q=label%3Arelease+)

  changelog-fragment:
    name: "Create changelog fragment"
    needs: [labeler]
    permissions:
      contents: read
      pull-requests: write # Needed to create changelog fragment PR comments
    runs-on: ubuntu-latest
    steps:
    - uses: ansys/actions/doc-changelog@v10.3.3
      with:
        token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
        bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
        bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}
