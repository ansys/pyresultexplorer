name: Tests (docker-based)

on:
  workflow_call:
    inputs:
      update-snapshots:
        description: 'Update snapshots'
        required: false
        default: false
        type: boolean

env:
  MAIN_PYTHON_VERSION: '3.12'

jobs:
  tests:
    name: "Tests (docker-based)"
    runs-on: ${{ matrix.os }}
    env:
      UPDATE_SNAPSHOTS: ${{ inputs.update-snapshots }}
    strategy:
      matrix:
       os: [ubuntu-latest] # can't run docker-compose on windows
       python-version: ['3.12'] # closer to release we can add other python versions
      fail-fast: false

    steps:

      - uses: actions/checkout@v6
        if: ${{ env.UPDATE_SNAPSHOTS != 'true' }}

      - uses: actions/checkout@v6
        if: ${{ env.UPDATE_SNAPSHOTS == 'true' }}
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

      - name: Start Result Explorer
        id: rx-compose
        uses: ./.github/actions/result-explorer-docker
        with:
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          ghcr-username: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          ghcr-token: ${{ secrets.PYANSYS_CI_BOT_PACKAGE_TOKEN }}
          license-server: ${{ secrets.LICENSE_SERVER }}
          server-tag: 'dev-dpf-v2026.1.pre1'
          web-tag: 'dev'
          results-folder: '${{ github.workspace }}/tests/data'

      - uses: extractions/netrc@v3
        with:
          machine: github.com
          username: pyansys-ci-bot
          password: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
          python-version: ${{ matrix.python-version }}
          enable-cache: "false"

      - name: Install dependencies
        run: |
            uv sync --group dev

      - name: Run tests
        run: |
            uv run pytest tests -m "" \
              --junitxml test_results_docker.xml \
              --cov=ansys --cov-report=term --cov-report=html:.cov/html --cov-report=markdown:cov.md \
              ${{ env.UPDATE_SNAPSHOTS == 'true' && '--snapshot-update' || '' }} \
              --server-url=${{ steps.rx-compose.outputs.server-url }} \
              --web-url=${{ steps.rx-compose.outputs.web-url }} \
              --is-docker

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '**/test*.xml'
          check_name: Test Report ${{ matrix.os }}:${{ matrix.python-version }} (Docker)
          detailed_summary: true
          include_passed: true

      - name: Show coverage report
        if: always()
        run: |
          echo "## Code Coverage" >> $GITHUB_STEP_SUMMARY
          cat cov.md >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage results
        uses: actions/upload-artifact@v7
        if: env.MAIN_PYTHON_VERSION == matrix.python-version
        with:
          name: coverage-tests-${{ matrix.os }}
          path: .cov
          retention-days: 7

      - name: Upload coverage results (as .coverage)
        uses: actions/upload-artifact@v7
        if: env.MAIN_PYTHON_VERSION == matrix.python-version
        with:
          name: coverage-file-tests-${{ matrix.os }}
          path: .coverage
          retention-days: 7

      - name: Generate snapshot diff summary
        if: always()
        run: python .github/scripts/generate_snapshot_summary.py

      - name: Upload snapshot diffs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-snapshot-diffs-report
          path: snapshot_diffs_report.html
          retention-days: 7

      - name: Dump server logs
        if: failure()
        run: |
          docker logs result-explorer-server

      - name: Commit base images
        if: ${{ (success() || failure()) && env.UPDATE_SNAPSHOTS == 'true' }}
        uses: EndBug/add-and-commit@v10
        with:
          add: |
            tests/__snapshots__
          default_author: github_actions
          message: 'update snapshots'
          pull: '--ff-only'
          github_token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
