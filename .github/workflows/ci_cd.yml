name: CI
on:
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: 'Update snapshots'
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    tags:
      - "*"
    branches:
      - main
  schedule:
    - cron: "0 5 * * *"

env:
  MAIN_PYTHON_VERSION: '3.10'
  DOCUMENTATION_CNAME: 'fuzzy-adventure-gzkzk5l.pages.github.io'
  LIBRARY_NAME: 'ansys-result-explorer-core'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  update-changelog:
    name: "Update CHANGELOG (on release)"
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: ansys/actions/doc-deploy-changelog@v10
        with:
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}


  code-style:
    name: "Code style"
    runs-on: ubuntu-latest
    steps:
      - uses: ansys/actions/code-style@v10
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

  # doc-style:
  #   name: "Documentation Style Check"
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: PyAnsys documentation style checks
  #       uses: ansys/actions/doc-style@v8
  #       with:
  #         token: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: "Tests"
    runs-on: ${{ matrix.os }}
    env:
      UPDATE_SNAPSHOTS: ${{ github.event_name == 'workflow_dispatch' && inputs.update-snapshots }}
    strategy:
      matrix:
       os: [ubuntu-latest] # can't run docker-compose on windows
       python-version: ['3.12'] # closer to release we can add other python versions
      fail-fast: false

    steps:

      - uses: actions/checkout@v6
        if: ${{ env.UPDATE_SNAPSHOTS != 'true' }}

      - uses: actions/checkout@v6
        if: ${{ env.UPDATE_SNAPSHOTS == 'true' }}
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

      - name: Start Result Explorer
        id: rx-compose
        uses: ./.github/actions/result_explorer
        with:
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          ghcr-username: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          ghcr-token: ${{ secrets.PYANSYS_CI_BOT_PACKAGE_TOKEN }}
          license-server: ${{ secrets.LICENSE_SERVER }}
          server-tag: 'dev-dpf-v2026.1.pre1'
          web-tag: 'expose-import-export'
          results-folder: '${{ github.workspace }}/tests/data'

      - uses: extractions/netrc@v3
        with:
          machine: github.com
          username: pyansys-ci-bot
          password: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
          python-version: ${{ matrix.python-version }}
          enable-cache: "false"

      - name: Install dependencies
        run: |
            uv sync --group dev

      - name: Run tests
        run: |
            uv run pytest tests -m "" \
              --junitxml test_results.xml \
              --cov=ansys --cov-report=term --cov-report=html:.cov/html --cov-report=markdown:cov.md \
              ${{ env.UPDATE_SNAPSHOTS == 'true' && '--snapshot-update' || '' }} \
              --server-url=${{ steps.rx-compose.outputs.server-url }} \
              --web-url=${{ steps.rx-compose.outputs.web-url }} \
              --is-docker

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '**/test*.xml'
          check_name: Test Report ${{ matrix.os }}:${{ matrix.python-version }}
          detailed_summary: true
          include_passed: true

      - name: Show coverage report
        if: always()
        run: |
          echo "## Code Coverage" >> $GITHUB_STEP_SUMMARY
          cat cov.md >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage results
        uses: actions/upload-artifact@v7
        if: env.MAIN_PYTHON_VERSION == matrix.python-version
        with:
          name: coverage-tests-${{ matrix.os }}
          path: .cov
          retention-days: 7

      - name: Upload coverage results (as .coverage)
        uses: actions/upload-artifact@v7
        if: env.MAIN_PYTHON_VERSION == matrix.python-version
        with:
          name: coverage-file-tests-${{ matrix.os }}
          path: .coverage
          retention-days: 7

      - name: Dump server logs
        if: failure()
        run: |
          docker logs result-explorer-server

      - name: Commit base images
        if: ${{ (success() || failure()) && env.UPDATE_SNAPSHOTS == 'true' }}
        uses: EndBug/add-and-commit@v10
        with:
          add: |
            tests/__snapshots__
          default_author: github_actions
          message: 'update snapshots'
          pull: '--ff-only'
          github_token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

  doc-build:
    name: "Build documentation"
    runs-on: ubuntu-latest
    # needs: [doc-style]
    steps:

      - uses: extractions/netrc@v3
        with:
          machine: github.com
          username: pyansys-ci-bot
          password: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

      - uses: ansys/actions/doc-build@v10
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          optional-dependencies-name: ""
          group-dependencies-name: "doc"

  build-library:
    name: "Build library"
    runs-on: ubuntu-latest
    steps:

      - uses: extractions/netrc@v3
        with:
          machine: github.com
          username: pyansys-ci-bot
          password: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

      - name: "Build library source and wheel artifacts"
        uses: ansys/actions/build-library@v10
        with:
          library-name: ${{ env.LIBRARY_NAME }}

  doc-deploy-dev:
    name: "Deploy development documentation"
    runs-on: ubuntu-latest
    needs: [doc-build, build-library, tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: ansys/actions/doc-deploy-dev@v10
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}

  doc-deploy-stable:
    name: "Deploy stable documentation"
    runs-on: ubuntu-latest
    needs: [doc-build, build-library, tests]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    steps:
      - uses: ansys/actions/doc-deploy-stable@v10
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}
