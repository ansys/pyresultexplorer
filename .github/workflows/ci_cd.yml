name: CI
on:
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: 'Update snapshots'
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    tags:
      - "*"
    branches:
      - main
  schedule:
    - cron: "0 5 * * *"

env:
  MAIN_PYTHON_VERSION: '3.12'
  DOCUMENTATION_CNAME: 'fuzzy-adventure-gzkzk5l.pages.github.io'
  LIBRARY_NAME: 'ansys-result-explorer-core'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  update-changelog:
    name: "Update CHANGELOG (on release)"
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: ansys/actions/doc-deploy-changelog@v10.3.2
        with:
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}


  code-style:
    name: "Code style"
    runs-on: ubuntu-latest
    steps:
      - uses: ansys/actions/code-style@v10.3.2
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

  # doc-style:
  #   name: "Documentation Style Check"
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: PyAnsys documentation style checks
  #       uses: ansys/actions/doc-style@v10.3.1
  #       with:
  #         token: ${{ secrets.GITHUB_TOKEN }}

  tests-docker:
    name: "Tests Docker"
    uses: ./.github/workflows/tests.yml
    with:
      deployment: docker
      update-snapshots: false
      python-versions: ${{ github.event_name == 'pull_request' && '["3.12"]' || '["3.11", "3.12", "3.13", "3.14"]' }}
    secrets: inherit

  tests-native:
    name: "Tests Native"
    uses: ./.github/workflows/tests.yml
    with:
      deployment: native
      update-snapshots: ${{ github.event_name == 'workflow_dispatch' && inputs.update-snapshots || false }}
      python-versions: ${{ github.event_name == 'pull_request' && '["3.12"]' || '["3.11", "3.12", "3.13", "3.14"]' }}
    secrets: inherit

  doc-build:
    name: "Build documentation"
    runs-on: ubuntu-latest
    env:
      RX_SERVER_INSTALLATION_PATH: '/tmp/result-explorer-server'
    # needs: [doc-style]
    steps:

      - uses: extractions/netrc@v3
        with:
          machine: github.com
          username: pyansys-ci-bot
          password: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

      - name: Install Result Explorer (native)
        id: install-rx
        uses: ./.github/actions/result-explorer-server
        with:
          version: 'latest-dev'
          installation-path: ${{ env.RX_SERVER_INSTALLATION_PATH }}
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

      - uses: ansys/actions/doc-build@v10.3.2
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          optional-dependencies-name: "playwright"
          group-dependencies-name: "doc,examples"
          check-links: false
        env:
          ANSYS_RESULT_EXPLORER_SERVER: ${{ env.RX_SERVER_INSTALLATION_PATH }}/viz-server

  build-library:
    name: "Build library"
    runs-on: ubuntu-latest
    steps:

      - uses: extractions/netrc@v3
        with:
          machine: github.com
          username: pyansys-ci-bot
          password: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

      - name: "Build library source and wheel artifacts"
        uses: ansys/actions/build-library@v10.3.2
        with:
          library-name: ${{ env.LIBRARY_NAME }}

  doc-deploy-dev:
    name: "Deploy development documentation"
    runs-on: ubuntu-latest
    needs: [doc-build, build-library, tests-docker, tests-native]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: ansys/actions/doc-deploy-dev@v10.3.2
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}

  doc-deploy-stable:
    name: "Deploy stable documentation"
    runs-on: ubuntu-latest
    needs: [doc-build, build-library, tests-docker, tests-native]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    steps:
      - uses: ansys/actions/doc-deploy-stable@v10.3.2
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}
