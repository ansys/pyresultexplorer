exclude: ^tests/data/

repos:

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c  # frozen: v0.17.3
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format

# Add copyright statement to files
- repo: https://github.com/ansys/pre-commit-hooks
  rev: 55c5b6a5439abd847613579c6924da750e8b78b2  # frozen: v0.8.0
  hooks:
  - id: add-license-headers
    args:
    - --start_year=2026
    - --custom_license=Apache-2.0

- repo: https://github.com/codespell-project/codespell
  rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
  hooks:
  - id: codespell
    exclude: >
      (?x)^(
          .*\.csv|
          .*\.txt
      )$
    args: [-I, .codespellignore]

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
    - id: check-merge-conflict
    - id: debug-statements
    - id: check-yaml
    - id: trailing-whitespace

- repo: https://github.com/tox-dev/pyproject-fmt
  rev: 50e0f3aee9dc5747a5f173f79a7417403c18dda6  # frozen: v2.30.3
  hooks:
    - id: pyproject-fmt
      args: [--keep-full-version]

- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df  # frozen: 0.39.0
  hooks:
    - id: check-github-workflows
