[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
# Check https://flit.readthedocs.io/en/latest/pyproject_toml.html for all available sections
name = "ansys-result-explorer-core"
version = "0.1.dev0"
description = "Python interface to Ansys Result Explorer"
readme = "README.rst"
requires-python = ">=3.10,<4.0"
authors = [
    {name = "ANSYS, Inc."},
]
maintainers = [
    {name = "ANSYS, Inc."},
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "ansys-api-result-explorer",
    "ansys-tools-path>=0.8.1",
    "grpcio>=1.63.0",
    "protobuf",
    "python-slugify>=8.0.4",
    "requests",
]

[project.optional-dependencies]
playwright = ["playwright>=1.50.0"]

[dependency-groups]
dev = [
    "pre-commit==4.6.0",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-playwright>=0.7.2",
    "syrupy>=5.1.0",
    "Pillow>=12.0.0",
    "pytest-rerunfailures==16.3",
]
doc = [
    "ansys-sphinx-theme==1.8.1",
    "numpydoc==1.10.0",
    "Sphinx==8.1.3",
    "sphinx-copybutton==0.5.2",
]
examples = [
    "matplotlib",
    "ipython",
]

[tool.flit.module]
name = "ansys.result_explorer.core"

[tool.uv]
default-groups = ["dev"]
cache-dir = "./.uv_cache"

[tool.uv.sources]
ansys-api-result-explorer = { git = "https://github.com/ansys-internal/result-explorer.git", subdirectory = "api/python", rev = "eb4e06755195b3b03c8d2c72721b2a0efbd21551" }

[project.urls]
Source = "https://github.com/ansys-internal/pyresultexplorer"
Tracker = "https://github.com/ansys-internal/pyresultexplorer/issues"
Homepage = "https://github.com/ansys-internal/pyresultexplorer"

[tool.ruff]
line-length = 100
extend-exclude = ["src/ansys/result_explorer/core/protogen"]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "C4",      # flake8-comprehensions
    "B",       # flake8-bugbear
    "PLE",     # Pylint errors
    "PLC",     # Pylint convention
    "PLW",     # Pylint warnings
    "PLR1711", # useless-return
    "PLR5501", # collapsible-else-if
    "Q",       # flake8-quotes
    "PT",      # flake8-pytest-style
    "LOG",     # flake8-logging
    # "D",       # pydocstyle
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"src/**/models.py" = ["F401"]
# ignore docstring requirements for tests, examples
"tests/**/*.py" = ["D", "PLC0415"]
"examples/**/*.py" = ["D", "PLC0415"]
# ignore docstring on client code for now
"src/**/client.py" = ["D"]
".github/scripts/*.py" = ["E501"]

[tool.pydocstyle]
convention = "numpy"

[tool.coverage.run]
source = ["ansys.result_explorer"]
omit = [".venv/*"]

[tool.coverage.report]
show_missing = true

[tool.towncrier]
package = "ansys.result_explorer.core"
directory = "doc/changelog.d"
filename = "doc/source/changelog.rst"
start_string = ".. towncrier release notes start\n"
template = "doc/changelog.d/changelog_template.jinja"
title_format = "`{version} <https://github.com/ansys-internal/pyresultexplorer/releases/tag/v{version}>`_ - {project_date}"
issue_format = "`#{issue} <https://github.com/ansys-internal/pyresultexplorer/pull/{issue}>`_"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "dependencies"
name = "Dependencies"
showcontent = true

[[tool.towncrier.type]]
directory = "miscellaneous"
name = "Miscellaneous"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "maintenance"
name = "Maintenance"
showcontent = true

[[tool.towncrier.type]]
directory = "test"
name = "Test"
showcontent = true

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
filterwarnings = [
    "ignore::urllib3.exceptions.InsecureRequestWarning",
]
markers = [
    "images: marks tests that create or compare images (deselect with '-m \"not images\"')",
]
addopts = "-ra -vv -m \"not images \""
